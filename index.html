<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Resize Element</title>
    <meta content="user-scalable=no, initial-scale=1, minimum-scale=1.0, width=device-width" name="viewport">
    <link rel="stylesheet" href="./src/style.css" />
</head>

<body>

<div>
    <span></span>
</div>

<script type="module">



import resizer from './src/script.js'

new resizer({
    width:     300, // initial Width
    minWidth:  100, 
    mahHeight: 75,
    height:    200, // initial Height
    maxHeight: 800,
    maxWidth:  900,
    parent:    'div', // The element to be resized
    child:     'span' // We need a full With/Height child element insde the parent
})


    </script>







</body>

</html>
